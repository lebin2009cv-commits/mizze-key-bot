<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizze Store - Key 24/7</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-glow"></div>
        <h1 class="store-title">MIZZE STORE</h1>
        <p class="store-subtitle">VƯỢT LINK - NHẬN KEY - TỰ ĐỘNG 24/7</p>

        <div class="balance-box">
            <span>SỐ DƯ COIN</span>
            <span class="coin-value">0 COIN</span>
        </div>

        <div class="section-card">
            <div class="section-title">// NHẬN KEY MIỄN PHÍ</div>
            <p class="section-desc">Chọn gói key bạn muốn cày lượt vượt link:</p>
            
            <div class="plan-buttons">
                <button id="plan-6h" class="plan-btn active" onclick="selectPlan('6h', 4)">KEY 6H (4 LINK)</button>
                <button id="plan-3h" class="plan-btn" onclick="selectPlan('3h', 3)">KEY 3H (3 LINK)</button>
            </div>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar">0 / 4</div>
            </div>

            <button class="action-btn" onclick="startEarn()">BẮT ĐẦU VƯỢT LINK</button>
        </div>

        <div class="section-card">
            <div class="section-title">// MUA KEY BẰNG VND</div>
            <p class="section-desc">Liên hệ trực tiếp Admin để kích hoạt nhanh</p>
            
            <div class="buy-item">
                <span>KEY 1 NGÀY <b>20.000 VNĐ</b></span>
                <button class="buy-btn" onclick="contactAdmin('Key 1 Ngày')">MUA</button>
            </div>
            <div class="buy-item">
                <span>KEY 7 NGÀY <b>70.000 VNĐ</b></span>
                <button class="buy-btn" onclick="contactAdmin('Key 7 Ngày')">MUA</button>
            </div>
            <div class="buy-item">
                <span>KEY 30 NGÀY <b>150.000 VNĐ</b></span>
                <button class="buy-btn" onclick="contactAdmin('Key 30 Ngày')">MUA</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
