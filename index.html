<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MIZZE KEY STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0a0a0a; --card:#141414; --red:#ff2b2b; --gold:#ffcf6b; --text:#f5f5f5; }
  body { background: radial-gradient(circle at 50% 0%, #2a0000 0%, #0a0a0a 60%), #0a0a0a; color:var(--text); font-family:'Orbitron', sans-serif; min-height:100vh; padding:20px; }
  h1 { text-align:center; font-size:22px; background:linear-gradient(90deg,var(--red),var(--gold),var(--red)); -webkit-background-clip:text; color:transparent; margin-bottom:20px; letter-spacing:2px; }
  .card { background:linear-gradient(145deg,#181818,#0e0e0e); border:1px solid rgba(255,43,43,.35); border-radius:14px; padding:16px; margin-bottom:14px; }
  .link-item { display:flex; justify-content:space-between; padding:10px; margin-bottom:8px; border-radius:8px; background:#0f0f0f; cursor:pointer; border:1px solid #333; }
  .link-item.done { border-color:var(--gold); color:var(--gold); }
  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-weight:800; background:linear-gradient(90deg,var(--red),#b30000); color:#fff; box-shadow:0 0 20px rgba(255,43,43,.5); cursor:pointer; }
  .btn:disabled { opacity:0.3; }
  .keybox { margin-top:12px; padding:14px; border:1px dashed var(--gold); color:var(--gold); text-align:center; font-weight:bold; }
</style>
</head>
<body>
  <h1>MIZZE KEY STORE</h1>
  <div class="card" id="task-card">
    <h2 style="color:var(--gold)">📋 NHIỆM VỤ (4 LINK)</h2>
    <div id="links"></div>
    <button class="btn" id="claimBtn" disabled>NHẬN KEY</button>
    <p id="warn" style="color:red; text-align:center; margin-top:10px;"></p>
  </div>
  <div class="card" id="key-card" style="display:none;">
    <h2 style="color:var(--gold)">🔑 KEY CỦA BẠN</h2>
    <div id="keyArea"></div>
  </div>

<script>
const API_URL = "https://TEN-RENDER-CUA-BAN.onrender.com"; // SỬA LINK NÀY SAU KHI RENDER XONG
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

let completed = new Set();
let links = [];

async function loadLinks(){
  const userId = tg?.initDataUnsafe?.user?.id;
  if(!userId) return alert("Vui lòng mở từ Telegram!");
  const r = await fetch(`${API_URL}/api/links?user_id=${userId}`).then(x=>x.json());
  links = r.links || [];
  render();
}

function render(){
  const box = document.getElementById("links");
  box.innerHTML = "";
  links.forEach((l,i)=>{
    const div = document.createElement("div");
    div.className = "link-item" + (completed.has(i) ? " done":"");
    div.innerHTML = `<span>Link ${i+1}</span><span>${completed.has(i) ? "✅ ĐÃ VƯỢT" : "⏳ CHƯA VƯỢT"}</span>`;
    if(!completed.has(i)){
      div.onclick = ()=>{
        window.open(l.url, "_blank");
      };
    }
    box.appendChild(div);
  });
  document.getElementById("claimBtn").disabled = completed.size < 4;
}

// Tự động check trạng thái từ server mỗi 3 giây
async function checkStatus(){
  const userId = tg?.initDataUnsafe?.user?.id;
  if(!userId) return;
  const r = await fetch(`${API_URL}/api/check_status?user_id=${userId}`).then(x=>x.json());
  completed = new Set(r.completed_indices || []);
  render();
}

document.getElementById("claimBtn").onclick = async ()=>{
  const userId = tg?.initDataUnsafe?.user?.id;
  if(!userId) return;
  const btn = document.getElementById("claimBtn");
  btn.disabled = true; btn.textContent = "ĐANG XỬ LÝ...";
  
  const r = await fetch(`${API_URL}/api/claim`, {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ user_id: userId })
  });
  const data = await r.json();
  
  if(data.ok){
    document.getElementById("task-card").style.display = "none";
    document.getElementById("key-card").style.display = "block";
    document.getElementById("keyArea").innerHTML = `<div class="keybox">${data.key}</div><p style="color:#888;text-align:center;">Hết hạn: ${data.expires}</p>`;
  } else {
    document.getElementById("warn").textContent = data.error;
    btn.disabled = false; btn.textContent = "NHẬN KEY";
  }
};

loadLinks();
setInterval(checkStatus, 3000);
</script>
</body>
</html>
